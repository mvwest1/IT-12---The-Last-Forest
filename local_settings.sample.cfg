; THE LAST FOREST - example settings (safe to upload; these are NOT the real values).
; Copy this file to local_settings.cfg (same folder) and change both values.
; local_settings.cfg is listed in .gitignore so it never reaches GitHub.

[secrets]

; 4-6 digit PIN that opens the Teacher panel (CSV export).
teacher_pin="1234"

; Long random text mixed into each LRN before hashing (SHA-256).
; Use the SAME salt on every lab PC; never change it once data collection starts.
lrn_salt="sample-salt-CHANGE-ME"
